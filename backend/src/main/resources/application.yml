server:
  port: ${PORT:8080}

spring:
  application:
    name: sneakx-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sneakx_db}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  jwt:
    secret: ${JWT_SECRET:SneakXSuperSecretKeyForJwtTokenSigningMustBeAtLeast32BytesLong}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:orders@sneakx.com}}
    from-name: ${MAIL_FROM_NAME:SneakX Orders}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

---
# Production Profile: Aiven MySQL / Managed MySQL
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sneakx_db}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
# Local Development / Testing: H2 In-Memory
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:sneakx_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: ""
